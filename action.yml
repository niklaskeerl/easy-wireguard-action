name: Easy WireGuard Connection
description: Easy WireGuard Connection Setup

inputs:
  WG_CONFIG_FILE:
    description: WireGuard (wg-quick) configuration file
    required: true

runs:
    using: composite
    steps:
        - run: |
              sudo apt-get install --yes resolvconf wireguard
              sudo install -d -m 700 /etc/wireguard
              sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
              echo "setting config"
              printf '%s\n' "$WG_CONFIG_FILE" | sudo tee /etc/wireguard/wg0.conf > /dev/null
              sudo wg-quick up wg0
          shell: bash
          env:
              WG_CONFIG_FILE: ${{ inputs.WG_CONFIG_FILE }}

branding:
  icon: shield
  color: red
